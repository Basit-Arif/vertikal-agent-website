version: '3.9'
services:
  web:
    build: .
    container_name: vertikal_web
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db/vertikal_agent
      - FLASK_ENV=production
    volumes:
      - .:/app
      - /app/.venv
    restart: always
 
  worker:
    build: .
    container_name: vertikal_worker
    command: uv run src/route/ai_route/livekit_agent.py start
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://testing-mwtbjpwy.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DATABASE_URL=mysql+pymysql://root:root@db/vertikal_agent
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/.venv
    restart: always
 
  db:
    image: mysql:8.0
    container_name: vertikal_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vertikal_agent
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  adminer:
    image: adminer
    container_name: vertikal_adminer
    restart: always
    ports:
      - "8080:8080"